name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - master

  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *' # Every day at 2am UTC

jobs:
  build-and-test:
    # Prevent scheduled/push runs in forks of the repository.
    if: github.repository == 'EpicCash/epic'

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo dependencies
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Build the project
      - name: Build
        run: cargo build --workspace --all-targets

      # Prepare foundation file for Windows tests
      - name: Copy foundation_floonet.json to target/debian (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target\debian -Force
          Copy-Item debian\foundation_floonet.json target\debian\foundation_floonet.json -Force

      # Run tests
      - name: Run tests
        run: cargo test --workspace -- --nocapture --test-threads=1

  cucumber-tests:
    if: >-
      github.repository == 'EpicCash/epic' &&
      (github.ref == 'refs/heads/master' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo dependencies
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Build the project
      - name: Build
        run: cargo build --workspace --all-targets

      # Run cucumber tests
      - name: Run cucumber tests
        run: cargo test --test cucumber --features cucumber-tests -- --nocapture
